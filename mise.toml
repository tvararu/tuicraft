[tools]
"npm:@biomejs/biome" = "latest"
bun = "latest"
gh = "latest"
hk = "latest"
jq = "latest"
pkl = "latest"

[settings]
npm.package_manager = "bun"

[tasks.bundle]
description = "Install dependencies and local Git hooks"
run = '''
set -e
bun install
hk install --mise
'''

[tasks.build]
description = "Compile single binary"
depends = ["bundle"]
sources = ["packages/core/src/**/*.ts", "packages/cli/src/**/*.ts", "packages/*/package.json", ".claude/skills/**/*.md"]
outputs = ["dist/tuicraft"]
run = "bun build --compile packages/cli/src/main.ts --outfile dist/tuicraft"

[tasks."build:all"]
description = "Cross-compile binaries for all platforms"
run = '''
set -e
for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
  suffix="${target#bun-}"
  echo "Building ${suffix}..."
  bun build --compile --target="${target}" packages/cli/src/main.ts --outfile "dist/tuicraft-${suffix}"
done
echo "Done. Binaries in dist/"
'''

[tasks.test]
description = "Run all tests"
raw = true
run = "bun test"

[tasks."test:live"]
description = "Run tests against a live server"
raw = true
run = "bun test ./packages/cli/test-support/live.ts ./packages/cli/test-support/live-quest.ts ./packages/cli/test-support/live-remote-motion.ts ./packages/cli/test-support/live-vendor.ts"

[tasks."test:coverage"]
description = "Run tests with coverage report"
raw = true
run = "bun test --coverage"

[tasks."test:slowest"]
description = "Show 10 slowest tests"
raw = true
run = '''
bun test --reporter=junit \
  --reporter-outfile=tmp/junit.xml && \
sed -n 's/.*<testcase name="\([^"]*\)".* time="\([^"]*\)".*/\2\t\1/p' \
  tmp/junit.xml | sort -rn | head -10 \
  | awk -F'	' '{printf "%7.1fms  %s\n",$1*1000,$2}'
'''

[tasks.ci]
description = "Run ci:checks, then sign off a clean HEAD as signoff/ci"
usage = '''
flag "--publish" help="Push HEAD to a temporary ref so an unpushed commit can be signed off, and fail if signoff fails"
'''
run = '''
set -eu
head=$(git rev-parse HEAD)
dirty=$(git status --porcelain)
mise run ci:checks
publish=${usage_publish:-false}
if [ -n "$dirty" ] || [ -n "$(git status --porcelain)" ] || [ "$(git rev-parse HEAD)" != "$head" ]; then
  echo "ci: checks passed, but the tree was not a clean HEAD throughout, so signoff/ci was not posted" >&2
  [ "$publish" = true ] && exit 1
  exit 0
fi
if [ "$publish" != true ]; then
  gh signoff ci || echo "ci: checks passed; signoff/ci not posted (HEAD must be pushed to its upstream)" >&2
  exit 0
fi
ref="refs/signoff/$head"
git push -q --no-verify origin "$head:$ref" </dev/null
status=0
gh signoff create -f ci || status=$?
git push -q --no-verify origin ":$ref" </dev/null
exit "$status"
'''

[tasks."ci:checks"]
description = "Run local typecheck, coverage tests, format, lint and docs checks"
depends = ["typecheck", "test:coverage", "format", "lint", "lint:docs"]

[tasks.typecheck]
description = "Type-check the whole repo and each package, or one package"
usage = 'arg "[package]" help="core, cli, factory, devtools or harness; omit to check the repo and every package"'
run = '''
case "${usage_package:-}" in
  "") exec bun run typecheck ;;
  core|cli|factory|devtools|harness) exec bun run tsc --noEmit -p "packages/${usage_package}" ;;
  *) echo "usage: mise typecheck [package]: unknown package '${usage_package}'; valid names: core, cli, factory, devtools, harness" >&2; exit 2 ;;
esac
'''

[tasks.format]
description = "Check formatting"
usage = 'arg "[path]" default="packages/" help="a package or file; defaults to every package"'
run = 'biome format ${usage_path}'

[tasks."format:fix"]
description = "Fix formatting"
usage = 'arg "[path]" default="packages/" help="a package or file; defaults to every package"'
run = 'biome format --write ${usage_path}'

[tasks.lint]
description = "Check lint rules and assist actions"
usage = 'arg "[path]" default="packages/" help="a package or file; defaults to every package"'
run = 'biome check --formatter-enabled=false --error-on-warnings ${usage_path}'

[tasks."lint:fix"]
description = "Apply safe lint fixes and assist actions"
usage = 'arg "[path]" default="packages/" help="a package or file; defaults to every package"'
run = 'biome check --write ${usage_path}'

[tasks."lint:docs"]
description = "Check current docs for dated history and dead references"
run = "bun packages/devtools/src/stale-docs.ts"

[tasks."factory:pace"]
description = "Show the factory pace, or set it to pause, default or max"
usage = '''
arg "[level]" help="pause, default or max; omit to show the live schedules"
'''
run = 'bun packages/factory/src/main.ts pace ${usage_level:-}'

[tasks.deploy]
description = "Build and symlink to /usr/local/bin"
depends = ["build"]
run = "ln -sf $PWD/dist/tuicraft /usr/local/bin/tuicraft"

[tasks."evidence:encounter"]
description = "Distil an encounter record from the session log"
raw = true
run = "bun run packages/devtools/src/distil-encounter.ts"

[tasks."namigator:build"]
description = "Build and install the patched libnamigator.so (vendor/namigator)"
raw = true
run = "bun packages/factory/src/namigator-library.ts"
